# The executable verifier. It has no dependency beyond the Lean toolchain, so a
# consumer can `require certifri` without inheriting Mathlib. Everything that
# needs Mathlib (the mathematical model, refinement and security theorems)
# lives in the separate package under `Proofs/`.
name = "certifri"
version = "0.1.0"
defaultTargets = ["CertiFri", "CertiFriP3", "CertiFriTest"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "CertiFri"

# The Plonky3 instantiation of the verifier's primitives: the fields, BLAKE3,
# the challenger, proof decoding. Tested against Plonky3; the laws of the
# fields are proved in `Proofs/`.
[[lean_lib]]
name = "CertiFriP3"

# Executable checks against reference code. Not part of the verifier; built by
# default so that a failing check fails the build.
[[lean_lib]]
name = "CertiFriTest"

# Times the verifier, as compiled code, on a vector written by
# `CertiFriTest/vectors/fri`. Not built by default.
[[lean_exe]]
name = "certifri-bench"
root = "CertiFriTest.Bench"
