# The executable Lean verifier scaffold. It depends only on the toolchain, so a
# consumer can `require certifri` without inheriting Mathlib. Everything that
# needs Mathlib (currently the field model and polynomial refinement proofs)
# lives in the separate package under `Proofs/`.
name = "certifri"
version = "0.1.0"
defaultTargets = ["CertiFri"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "CertiFri"
